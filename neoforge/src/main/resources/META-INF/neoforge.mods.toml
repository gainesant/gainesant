modLoader = "javafml"
loaderVersion = "[4,)"
license = "${modLicense}"
issueTrackerURL = "https://github.com/gainesant/gainesant/issues"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${modName}"
authors = "${modAuthors}"
description = '''${modDescription}'''

# Coreframe is an original work. It is not affiliated with, endorsed by, or derived
# from any existing game or its publisher. Any resemblance is to genre convention and
# to game mechanics, which are not copyrightable.

[[dependencies.${modId}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoVersion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modId}]]
modId = "geckolib"
type = "required"
versionRange = "[5.5,)"
ordering = "AFTER"
side = "BOTH"

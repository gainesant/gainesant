# Access transformers for Coreframe.
#
# The orbit camera has to place the camera around a pivot that is not the player's eyes.
# Vanilla keeps the setters protected, and NeoForge's events only expose the angles, so
# widening these is what lets the camera controller work without mixing into Camera and
# colliding with every other camera mod in the pack.
#
# UNVERIFIED against Minecraft 26.2 — confirm these signatures against the actual
# decompiled sources before relying on them. Minecraft is deobfuscated from 26.1 onward,
# so the names here are the official ones rather than obfuscated or SRG names.

public net.minecraft.client.Camera setPosition(Lnet/minecraft/world/phys/Vec3;)V
public net.minecraft.client.Camera setRotation(FF)V
public net.minecraft.client.MouseHandler accumulatedDX
public net.minecraft.client.MouseHandler accumulatedDY

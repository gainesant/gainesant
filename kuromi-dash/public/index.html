<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#151019">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Kuromi Dash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="kuromi.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main class="dash">
    <!-- top bar -->
    <header class="topbar">
      <div class="brand">
        <img src="kuromi.svg" alt="" class="brand-icon">
        <span>Kuromi&nbsp;Dash</span>
      </div>
      <div class="status">
        <span id="weather" class="chip" hidden></span>
        <span id="gps-chip" class="chip chip-off">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>
          <span id="gps-chip-text">Finding GPS…</span>
        </span>
        <time id="top-clock" class="top-clock">--:--</time>
      </div>
    </header>

    <!-- left column -->
    <section class="col col-left">
      <article class="card clock-card">
        <time id="clock" class="clock">--:--</time>
        <div id="ampm" class="ampm"></div>
        <div id="date" class="date"></div>
      </article>

      <article class="card speed-card">
        <svg class="gauge" viewBox="0 0 200 130" aria-hidden="true">
          <path class="gauge-track" d="M20 110 A80 80 0 0 1 180 110"/>
          <path id="gauge-fill" class="gauge-fill" d="M20 110 A80 80 0 0 1 180 110"/>
        </svg>
        <div class="speed-read">
          <span id="speed" class="speed">--</span>
          <button id="units" class="units" type="button">mph</button>
        </div>
        <div id="gps-note" class="note">Waiting for GPS…</div>
      </article>

      <article class="card mascot-card">
        <img src="kuromi.svg" alt="Kuromi" class="mascot" id="mascot">
        <p id="quip" class="quip">Buckle up, cutie. We ride at midnight.</p>
      </article>
    </section>

    <!-- center: live map -->
    <section class="stage" id="stage">
      <div id="map" class="map" aria-label="Map of where you are"></div>

      <form id="go" class="go" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="dest" type="text" placeholder="Where to, cutie?" enterkeyhint="go" aria-label="Destination">
        <button type="submit" data-nav="maps" class="go-btn">Maps</button>
        <button type="submit" data-nav="waze" class="go-btn go-alt">Waze</button>
      </form>

      <button id="recenter" class="recenter" type="button" title="Back to me" hidden>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>

      <div id="welcome" class="welcome">
        <img src="kuromi.svg" alt="" class="welcome-mascot">
        <h1 id="welcome-title">Finding you…</h1>
        <p id="welcome-text">Allow location so Kuromi can show the map and your speed.</p>
      </div>
    </section>

    <!-- right column -->
    <section class="col col-right">
      <article class="card apps-card">
        <h2>Drive</h2>
        <div class="apps" data-group="drive"></div>
      </article>

      <article class="card apps-card">
        <h2>Listen</h2>
        <div class="apps" data-group="listen"></div>
      </article>

      <article class="card apps-card">
        <h2>Talk</h2>
        <div class="apps" data-group="talk"></div>
      </article>

      <article class="card climate-card">
        <h2>Cabin <span class="tag" title="Not wired to the car yet — see README">demo</span></h2>
        <div class="climate">
          <button class="round" data-temp="-1" title="Cooler">−</button>
          <div class="temp"><span id="temp">70</span>°</div>
          <button class="round" data-temp="1" title="Warmer">+</button>
        </div>
        <div class="fan">
          <span>Fan</span>
          <input id="fan" type="range" min="0" max="5" value="2" aria-label="Fan speed">
        </div>
      </article>
    </section>

    <!-- dock -->
    <footer class="dock">
      <button class="dock-btn" id="dock-me" title="Center map on me"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span>Me</span></button>
      <button class="dock-btn" id="dock-focus" title="Big map"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Focus</span></button>
      <button class="dock-btn dock-center" id="dock-kuromi" title="Kuromi says…"><img src="kuromi.svg" alt=""></button>
      <button class="dock-btn" id="dock-night" title="Dim screen"><svg viewBox="0 0 24 24"><path d="M20 14A8 8 0 1 1 10 4a7 7 0 0 0 10 10z"/></svg><span>Dim</span></button>
      <button class="dock-btn" id="dock-full" title="Full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span>Full</span></button>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

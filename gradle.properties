org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Identity
modId=coreframe
modName=Coreframe
modVersion=0.1.0
modGroup=com.gainesant.coreframe
modAuthors=gainesant
modLicense=MIT
modDescription=Arena mecha duels: build a core from swappable parts and fight in the Grid.

# Platform. Minecraft moved to calendar versioning in 2026 (year.drop.hotfix),
# so this is "26.2", not "1.21.x".
minecraftVersion=26.2
neoVersion=26.2.0-beta
geckolibVersion=5.5.3

# The mod targets Java 25 (required by MC 26.x). The core module deliberately
# targets 21 so the rules engine stays buildable on older toolchains.
modJavaVersion=25
coreJavaVersion=21
